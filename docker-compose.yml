services:
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: .
    environment:
      REDIS_ADDR: redis:6379
      RATE_LIMIT: "100"
      RATE_WINDOW: "1m"
      FAIL_OPEN: "false"
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
